name: Results site evidence

on:
  push:
    paths:
      - 'site/**'
      - 'reports/ifeval-browser-v1-final/result.json'
      - 'reports/ifeval-browser-v2-collaboration-run/result.json'
      - 'scripts/update_results_site.py'
      - 'scripts/verify_results_site.py'
      - '.github/workflows/results-site.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'reports/ifeval-browser-v1-final/result.json'
      - 'reports/ifeval-browser-v2-collaboration-run/result.json'
      - 'scripts/update_results_site.py'
      - 'scripts/verify_results_site.py'
      - '.github/workflows/results-site.yml'

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python scripts/update_results_site.py --check
      - run: python scripts/verify_results_site.py
      - run: node --check site/app.js
