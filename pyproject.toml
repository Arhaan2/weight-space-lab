[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "weight-space-lab"
version = "0.1.0"
description = "Auditable mechanics for controlled language-model weight-editing experiments"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Arhaan Aggarwal"}]
dependencies = ["numpy>=2.2.6,<=2.3.5"]
license = "MIT"

[project.optional-dependencies]
native-cpu = ["numpy==2.3.5", "torch==2.10.0", "transformers==5.3.0", "tokenizers==0.22.2", "safetensors==0.7.0", "jinja2==3.1.6"]
native-vllm = ["numpy==2.2.6", "vllm==0.17.0", "torch==2.10.0", "transformers==4.57.6", "tokenizers==0.22.2", "safetensors==0.7.0", "jinja2==3.1.6"]

[project.scripts]
weight-space-lab = "weight_space_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["weight_space_lab*"]
